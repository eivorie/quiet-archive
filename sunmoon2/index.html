<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sun & Moon</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="index.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body class="sunmoon-home">

    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav class="nav">
        <a href="../index.html">Home</a>
        <a href="../memories.html">Memories</a>
        <a href="../ereri/index.html">Ereri</a>
        <a href="../depending-on-the-weather/index.html">Depending on the weather</a>
        <a href="../archive.html">Our Archive</a>
        <a href="../sunmoon2/index.html">Sun & Moon</a>
    </nav>

    <main class="home">

        <header class="hero">
    
            <h1>Sun & Moon</h1>
    
            <div class="divider"></div>
    
        </header>
    
        <section class="carousel">

            <button class="carousel-btn prev" aria-label="Previous">
                ❮
            </button>
        
            <div class="carousel-window">
        
                <div class="carousel-track">
        
                    <!-- MOON -->
                    <a
                        class="card moon active"
                        href="moon/fases-da-lua.html"
                        aria-label="Read Fases da Lua">
        
                        <img
                            src="assets/fases-da-lua.png"
                            alt="Fases da Lua tarot card">
                    </a>
        
                    <!-- SUN -->
                    <a
                        class="card sun right"
                        href="sun/la-ou-commence-la-lumiere.html"
                        aria-label="Read Là où commence la lumière">
        
                        <img
                            src="assets/la-ou-commence-la-lumiere.png"
                            alt="Là où commence la lumière tarot card">
                    </a>
        
                    <!-- ECLIPSE -->
                    <a
                        class="card eclipse left"
                        href="eclipse/eclipse.html"
                        aria-label="Read Eclipse">
        
                        <img
                            src="assets/eclipse.png"
                            alt="Eclipse tarot card">
                    </a>
        
                    <!-- STARS -->
                    <a
                        class="card stars"
                        href="stars/stars.html"
                        aria-label="Read The Sky Between Us">
        
                        <img
                            src="assets/the-sky-between-us.png"
                            alt="The Sky Between Us tarot card">
                    </a>
        
                </div>
        
            </div>
        
            <button class="carousel-btn next" aria-label="Next">
                ❯
            </button>
        
        </section>
    
        <div class="carousel-dots">
    
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
    
        </div>
    
    </main>

    <script src="index.js"></script>

</body>

</html>
